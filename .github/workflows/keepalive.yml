name: Mantener Supabase activo

# El plan gratuito de Supabase pausa los proyectos tras 7 días sin actividad.
# Esta consulta diaria de solo lectura evita que se duerma.

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        run: |
          curl -fsS \
            -H "apikey: sb_publishable_5rYNo_9xb9eT_izTaSCzUQ_ErQAVyIj" \
            "https://yzjixcxqtgtnhsxbvvza.supabase.co/rest/v1/lists?select=id&limit=1"
